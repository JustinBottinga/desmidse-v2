backend:
  name: git-gateway
  branch: main

# Wijzigingen komen eerst als concept op een aparte branch en gaan pas live
# na op "Publiceren" te klikken.
publish_mode: editorial_workflow

# Alleen actief op localhost: `npx decap-server` naast `npm run dev`
local_backend: true

media_folder: "public/media/uploads"
public_folder: "/media/uploads"

site_url: https://www.desmidsebta.nl
display_url: https://www.desmidsebta.nl
logo_url: https://www.desmidsebta.nl/media/logo.png

locale: nl

collections:
  - name: "home"
    label: "Home"
    label_singular: "Homepagina"
    files:
      - name: "home"
        label: "Homepagina"
        file: "src/content/pages/home.json"
        fields:
          - label: "Dienstenkaart"
            name: "dienstenKaart"
            widget: "object"
            fields:
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Introzin", name: "intro", widget: "string" }
              - label: "Lijstitems"
                name: "items"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
          - label: "Kaart 'Wij werken voor'"
            name: "overKaart"
            widget: "object"
            fields:
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Subtitel", name: "subtitel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }
          - label: "Belkaart"
            name: "belKaart"
            widget: "object"
            fields:
              - { label: "Kop", name: "kop", widget: "string" }
              - {
                  label: "Telefoon (weergave)",
                  name: "telefoonLabel",
                  widget: "string",
                }
              - {
                  label: "Telefoonnummer (om te bellen)",
                  name: "telefoonNummer",
                  widget: "string",
                }
              - { label: "Tekst", name: "tekst", widget: "text" }
              - { label: "Knoptekst", name: "knopLabel", widget: "string" }
          - label: "Keurmerken"
            name: "keurmerken"
            widget: "object"
            fields:
              - { label: "Kop", name: "kop", widget: "string" }
              - label: "Kolommen"
                name: "kolommen"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Tekst", name: "tekst", widget: "markdown" }
              - label: "Logo's onder de kolommen"
                name: "logos"
                widget: "list"
                required: false
                summary: "{{fields.alt}}"
                hint: "Worden als vierkante vlakken naast elkaar getoond."
                fields:
                  - { label: "Afbeelding", name: "afbeelding", widget: "image" }
                  - {
                      label: "Alternatieve tekst",
                      name: "alt",
                      widget: "string",
                      hint: "Beschrijf het logo, voor screenreaders.",
                    }

  - name: "over-mij"
    label: "Over mij"
    label_singular: "Over mij"
    files:
      - name: "over-mij"
        label: "Over mij"
        file: "src/content/pages/about.json"
        fields:
          - label: "Header"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Afbeelding", name: "afbeelding", widget: "image" }
              - { label: "Titel", name: "titel", widget: "string" }
              - {
                  label: "Subtitel",
                  name: "subtitel",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Introtekst",
                  name: "intro",
                  widget: "text",
                  required: false,
                }
          - label: "Secties"
            name: "secties"
            widget: "list"
            summary: "{{fields.kop}}"
            fields:
              - { label: "Kop", name: "kop", widget: "string", required: false }
              - {
                  label: "Introzin boven de kolommen",
                  name: "intro",
                  widget: "string",
                  required: false,
                }
              - label: "Kolommen"
                name: "kolommen"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - {
                      label: "Label",
                      name: "label",
                      widget: "string",
                      required: false,
                    }
                  - { label: "Tekst", name: "tekst", widget: "markdown" }
              - {
                  label: "Tekst onder de kolommen",
                  name: "tekst",
                  widget: "markdown",
                  required: false,
                }
              - {
                  label: "Scheidingslijn eronder",
                  name: "scheidingslijn",
                  widget: "boolean",
                  required: false,
                  default: false,
                }

  - name: "contact"
    label: "Contact"
    label_singular: "Contactpagina"
    files:
      - name: "contact"
        label: "Contactgegevens"
        file: "src/content/pages/contact.json"
        fields:
          - { label: "Paginatitel", name: "titel", widget: "string" }
          - label: "Openingstijden"
            name: "openingstijden"
            widget: "object"
            fields:
              - { label: "Kop", name: "kop", widget: "string" }
              - label: "Regels"
                name: "regels"
                widget: "list"
                field: { label: "Regel", name: "regel", widget: "string" }
          - label: "Adres"
            name: "adres"
            widget: "object"
            fields:
              - { label: "Kop", name: "kop", widget: "string" }
              - {
                  label: "Bedrijfsnaam",
                  name: "bedrijfsnaam",
                  widget: "string",
                }
              - {
                  label: "Straat en huisnummer",
                  name: "straat",
                  widget: "string",
                }
              - { label: "Postcode", name: "postcode", widget: "string" }
              - { label: "Plaats", name: "plaats", widget: "string" }
          - label: "Gegevens"
            name: "gegevens"
            widget: "object"
            fields:
              - { label: "E-mailadres", name: "email", widget: "string" }
              - {
                  label: "Telefoon (weergave)",
                  name: "telefoon",
                  widget: "string",
                }
              - {
                  label: "Telefoonnummer (om te bellen)",
                  name: "telefoonNummer",
                  widget: "string",
                }
              - { label: "KvK-nummer", name: "kvk", widget: "string" }
  - name: "diensten"
    label: "Diensten"
    label_singular: "Dienst"
    folder: "src/content/diensten"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{menuLabel}}"
    sortable_fields: ["volgorde", "titel"]
    fields:
      - {
          label: "Volgorde in het menu",
          name: "volgorde",
          widget: "number",
          value_type: "int",
          min: 1,
        }
      - {
          label: "Menulabel",
          name: "menuLabel",
          widget: "string",
          hint: "Zoals de dienst in het menu en de footer verschijnt.",
        }
      - { label: "Titel", name: "titel", widget: "string" }
      - {
          label: "Subtitel",
          name: "subtitel",
          widget: "string",
          required: false,
        }
      - { label: "Introtekst", name: "intro", widget: "text", required: false }
      - {
          label: "Header-afbeelding",
          name: "afbeelding",
          widget: "image",
          required: false,
        }
      - {
          label: "Meta-titel",
          name: "metaTitel",
          widget: "string",
          required: false,
          hint: "De titel in Google en in het tabblad. Ideaal tot 60 tekens. Leeg = Titel + sitenaam.",
          pattern: ["^.{0,70}$", "Maximaal 70 tekens"],
        }
      - {
          label: "Meta-beschrijving",
          name: "metaBeschrijving",
          widget: "text",
          required: false,
          hint: "De tekst onder de titel in Google. Ideaal 120 tot 155 tekens. Leeg = de introtekst.",
          pattern: ["^(.|\n){0,170}$", "Maximaal 170 tekens"],
        }
      - {
          label: "Meta-afbeelding",
          name: "metaAfbeelding",
          widget: "image",
          required: false,
          hint: "Afbeelding bij delen via WhatsApp, LinkedIn e.d. Leeg = header-afbeelding of standaardafbeelding.",
        }
      - label: "Secties"
        name: "secties"
        widget: "list"
        required: false
        summary: "{{fields.kop}}"
        fields:
          - { label: "Kop", name: "kop", widget: "string", required: false }
          - {
              label: "Introzin boven de kolommen",
              name: "intro",
              widget: "string",
              required: false,
            }
          - label: "Kolommen"
            name: "kolommen"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            fields:
              - {
                  label: "Label",
                  name: "label",
                  widget: "string",
                  required: false,
                }
              - { label: "Tekst", name: "tekst", widget: "markdown" }
          - {
              label: "Tekst onder de kolommen",
              name: "tekst",
              widget: "markdown",
              required: false,
            }
          - {
              label: "Scheidingslijn eronder",
              name: "scheidingslijn",
              widget: "boolean",
              required: false,
              default: false,
            }

  - name: "overige-paginas"
    label: "Overige pagina's"
    label_singular: "Pagina"
    files:
      - name: "diensten-overzicht"
        label: "Diensten - overzichtspagina"
        file: "src/content/pages/diensten.json"
        fields:
          - { label: "Titel", name: "titel", widget: "string" }
          - { label: "Introtekst", name: "intro", widget: "text" }
          - {
              label: "Meta-titel",
              name: "metaTitel",
              widget: "string",
              required: false,
              hint: "De titel in Google en in het tabblad. Ideaal tot 60 tekens.",
              pattern: ["^.{0,70}$", "Maximaal 70 tekens"],
            }
          - {
              label: "Meta-beschrijving",
              name: "metaBeschrijving",
              widget: "text",
              required: false,
              hint: "De tekst onder de titel in Google. Ideaal 120 tot 155 tekens.",
              pattern: ["^(.|\n){0,170}$", "Maximaal 170 tekens"],
            }
          - {
              label: "Meta-afbeelding",
              name: "metaAfbeelding",
              widget: "image",
              required: false,
            }

  - name: "instellingen"
    label: "Navigatie en footer"
    label_singular: "Instelling"
    files:
      - name: "site"
        label: "Navigatie, footer en standaard metadata"
        file: "src/content/site.json"
        fields:
          - label: "Navigatie (menu bovenin)"
            name: "navigatie"
            widget: "object"
            fields:
              - label: "Logo-stijl"
                name: "logoStijl"
                widget: "select"
                default: "klein-tekst"
                options:
                  - { label: "Klein logo met tekst (naam als tekst naast het logo)", value: "klein-tekst" }
                  - { label: "Klein logo, zonder tekst", value: "klein" }
                  - { label: "Groot logo (de tekst zit in de afbeelding)", value: "groot" }
              - {
                  label: "Klein logo",
                  name: "logoKlein",
                  widget: "image",
                  required: false,
                  hint: "Pictogram of klein logo, ongeveer 32 px hoog getoond. Leeg = standaardlogo.",
                }
              - {
                  label: "Groot logo (met tekst)",
                  name: "logoGroot",
                  widget: "image",
                  required: false,
                  hint: "Alleen voor de stijl Groot. Gebruik een logo waar de bedrijfsnaam al in staat, liefst PNG of SVG met transparante achtergrond.",
                }
              - {
                  label: "Logotekst",
                  name: "logoTekst",
                  widget: "string",
                  required: false,
                  hint: "De tekst naast het kleine logo, en de alt-tekst van het logo. Leeg = sitenaam.",
                }
              - label: "Menu-items"
                name: "items"
                widget: "list"
                summary: "{{fields.label}}"
                hint: "Volgorde = volgorde in het menu. Sleep om te verplaatsen."
                fields:
                  - { label: "Tekst", name: "label", widget: "string" }
                  - {
                      label: "Link",
                      name: "link",
                      widget: "string",
                      hint: "Pagina op deze site, bijvoorbeeld /contact, of een volledig adres (https://...).",
                    }
                  - {
                      label: "Diensten uitklappen",
                      name: "dropdown",
                      widget: "boolean",
                      required: false,
                      default: false,
                      hint: "Aan = onder dit item verschijnt een uitklapmenu met alle diensten.",
                    }
              - {
                  label: "Belknop tonen",
                  name: "belKnopTonen",
                  widget: "boolean",
                  required: false,
                  default: true,
                  hint: "De oranje knop met het telefoonnummer (uit Contactgegevens).",
                }

          - label: "Footer (onderaan)"
            name: "footer"
            hint: "Adres, telefoon en e-mail in de footer pas je aan onder Contact."
            widget: "object"
            fields:
              - {
                  label: "Diensten tonen",
                  name: "toonDiensten",
                  widget: "boolean",
                  required: false,
                  default: true,
                }
              - { label: "Kop diensten", name: "dienstenKop", widget: "string" }
              - { label: "Kop pagina's", name: "paginaKop", widget: "string" }
              - label: "Pagina-links"
                name: "paginaLinks"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - { label: "Tekst", name: "label", widget: "string" }
                  - {
                      label: "Link",
                      name: "link",
                      widget: "string",
                      hint: "Bijvoorbeeld /contact of https://...",
                    }
              - {
                  label: "Regel onderaan",
                  name: "onderregel",
                  widget: "string",
                  required: false,
                  hint: "Bijvoorbeeld een copyright- of voorwaardenregel. Leeg = niet tonen.",
                }

          - label: "Standaard metadata"
            name: "metadata"
            widget: "object"
            fields:
              - {
                  label: "Website-adres",
                  name: "siteUrl",
                  widget: "string",
                  hint: "Zonder slash aan het eind, bijvoorbeeld https://www.desmidsebta.nl",
                }
              - { label: "Sitenaam", name: "siteNaam", widget: "string" }
              - {
                  label: "Standaardbeschrijving",
                  name: "standaardBeschrijving",
                  widget: "text",
                  hint: "Wordt gebruikt voor pagina's zonder eigen meta-beschrijving.",
                }
              - {
                  label: "Standaardafbeelding",
                  name: "standaardAfbeelding",
                  widget: "image",
                  required: false,
                }
